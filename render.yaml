databases:
  - name: questlog-db
    plan: free   # check Render's current free-database limits; upgrade before real users
services:
  - type: web
    name: questlog
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKBOARD_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MESSAGE_FILES
        value: all
      - key: ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: questlog-db
          property: connectionString
